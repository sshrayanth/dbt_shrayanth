models:
  - name: stg_nations
    description: Table for nation's date
    columns:
      - name: nation_id
        data_tests:
          - unique
          - not_null

  - name: stg_regions
    columns:
      - name: region_name
        data_tests:
          - accepted_values:
              arguments:
                values: ['AFRICA', 'AMERICA', 'ASIA', 'EUROPE']
              config:
                store_failures: true

  - name: stg_orders
    description: order information table
    columns:
      - name: total_price
        data_tests:
          - order_values:
            # description: testing order values
              config:
                store_failures: true

                